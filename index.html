<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLIXHIRE — AI Creator Marketplace</title>
<style>
:root{--bg:#f7f8fc;--card:#fff;--text:#151827;--muted:#697084;--line:#e5e7ef;--accent:#6d4aff}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:5}.logo{font-weight:900;font-size:20px;display:flex;align-items:center;gap:10px}.mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#6d4aff,#aa91ff);color:white;display:grid;place-items:center}nav button{border:0;background:transparent;padding:10px 14px;border-radius:9px;cursor:pointer;color:var(--muted)}nav button:hover{background:#f0eff8;color:var(--text)}
main{max-width:1200px;margin:auto;padding:34px 20px}.hero{display:flex;justify-content:space-between;gap:25px;align-items:end}.eyebrow{color:var(--accent);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.1em}.hero h1{font-size:40px;margin:8px 0}.hero p{color:var(--muted);max-width:680px}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:750;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:25px 0}.stat{background:var(--card);border:1px solid var(--line);padding:18px;border-radius:14px}.stat b{font-size:24px}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.layout{display:grid;grid-template-columns:240px 1fr;gap:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px}.filters{padding:18px;height:max-content}.field{margin:15px 0}.field label{font-size:12px;font-weight:750;display:block;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.card{padding:15px;cursor:pointer}.card:hover{box-shadow:0 15px 35px #1b1e2d12;transform:translateY(-2px)}.cover{height:130px;border-radius:11px;background:linear-gradient(135deg,#17192b,#7059e7);display:flex;align-items:end;padding:13px;color:#fff;font-weight:800}.top{display:flex;justify-content:space-between;margin-top:12px}.person{display:flex;gap:9px;align-items:center}.mini{width:40px;height:40px;border-radius:11px;background:#f0f1f6;display:grid;place-items:center;font-weight:800}.person small{display:block;color:var(--muted)}.verified{font-size:11px;background:#e8f8f1;color:#08764a;padding:5px 8px;border-radius:20px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.tag{font-size:11px;background:#f0f1f6;padding:5px 7px;border-radius:6px;color:#555d70}.meta{border-top:1px solid var(--line);padding-top:10px;display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.match{color:var(--accent);font-weight:800}.empty{text-align:center;padding:50px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0b0d1680;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.dialog{background:#fff;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:24px;border-radius:18px}.close{float:right;border:0;background:#f0f1f6;border-radius:8px;width:34px;height:34px;cursor:pointer}.toast{position:fixed;right:20px;bottom:20px;background:#151827;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:30}@media(max-width:850px){nav{display:none}.hero{flex-direction:column;align-items:start}.stats{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style></head><body><header><div class="logo"><div class="mark">F</div>FLIXHIRE <small style="color:#697084;font-size:10px">AI CREATOR MARKETPLACE</small></div><nav><button onclick="discover()">Discover</button><button onclick="brief()">My Briefs</button><button onclick="shortlisted()">Shortlist <span id="shortCount">0</span></button></nav><div>SM</div></header><main id="app"></main><div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()"><div id="dialog" class="dialog"></div></div><div id="toast" class="toast"></div>
<script>
const API='http://localhost:8080/api';let shortlist=new Set(JSON.parse(localStorage.getItem('flixhireShortlist')||'[]'));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem('flixhireShortlist',JSON.stringify([...shortlist]));document.getElementById('shortCount').textContent=shortlist.size}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}
function params(){let f=document.getElementById('filterForm');let p=new URLSearchParams(new FormData(f));for(let [k,v] of [...p])if(!v)p.delete(k);return p}
async function load(){let g=document.getElementById('grid');g.innerHTML='<div class="empty">Finding matching creators...</div>';try{let r=await fetch(API+'/creators?'+params());if(!r.ok)throw Error();let d=await r.json();document.getElementById('count').textContent=d.length;g.innerHTML=d.length?d.map(card).join(''):'<div class="empty">No creators match these filters.<br><button class="btn secondary" onclick="resetFilters()">Clear filters</button></div>'}catch(e){g.innerHTML='<div class="empty">Unable to connect to FLIXHIRE creator service.<br>Start the Java backend on port 8080.</div>'}}
function card(c){return `<article class="panel card" onclick="profile(${c.id})"><div class="cover">${esc(c.role)}</div><div class="top"><div class="person"><div class="mini">${esc(c.name.split(' ').map(x=>x[0]).join(''))}</div><div><b>${esc(c.name)}</b><small>${esc(c.role)}</small></div></div>${c.verified?'<span class="verified">✓ Verified</span>':''}</div><div class="tags">${c.tools.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}${c.formats.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><div class="meta"><span>★ ${c.rating} · $${c.rate}/hr</span><span class="match">${c.match}% match</span></div></article>`}
function resetFilters(){document.getElementById('filterForm').reset();load()}async function profile(id){let c=await(await fetch(API+'/creators/'+id)).json();document.getElementById('dialog').innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>${esc(c.name)}</h2><p style="color:#697084">${esc(c.role)} · ${esc(c.specialization)}</p><p>${esc(c.description)}</p><h4>AI tools</h4><div class="tags">${c.tools.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><h4>Workflow</h4><p>${esc(c.workflow)}</p><h4>Match score</h4><strong style="font-size:30px;color:#6d4aff">${c.match}%</strong><p>Based on tools, specialization and content format.</p><button class="btn secondary" onclick="toggle(${c.id})">${shortlist.has(c.id)?'✓ Shortlisted':'＋ Shortlist'}</button> <button class="btn primary" onclick="invite('${esc(c.name)}')">Invite to project</button>`;document.getElementById('modal').classList.add('show')}
function toggle(id){shortlist.has(id)?shortlist.delete(id):shortlist.add(id);save();profile(id);toast(shortlist.has(id)?'Creator added to shortlist':'Removed from shortlist')}function invite(n){closeModal();toast('Invitation sent to '+n)}function closeModal(){document.getElementById('modal').classList.remove('show')}
function brief(){document.getElementById('dialog').innerHTML=`<button class="close" onclick="closeModal()">×</button><div class="eyebrow">AI-ASSISTED BRIEF BUILDER</div><h2>Turn an idea into a creator-ready brief</h2><textarea id="idea" rows="6" placeholder="We need a 20-second premium skincare ad for Instagram..."></textarea><br><br><button class="btn primary" onclick="generateBrief()">✦ Generate structured brief</button><div id="generated"></div>`;document.getElementById('modal').classList.add('show')}
function generateBrief(){let i=esc(document.getElementById('idea').value||'Premium skincare campaign');document.getElementById('generated').innerHTML=`<div style="background:#f2efff;padding:15px;border-radius:12px;margin-top:15px"><b>✦ AI-generated brief</b><p><b>Campaign:</b> Premium skincare social campaign<br><b>Content:</b> 20-second hero video<br><b>Style:</b> Clean, premium, soft morning light<br><b>Platform:</b> Instagram<br><b>Format:</b> 9:16, 1080×1920<br><b>Preferred tools:</b> Runway Gen-3 / Kling<br><b>Idea:</b> ${i}</p><button class="btn primary" onclick="closeModal();toast('Brief published successfully')">Publish brief</button></div>`}
function discover(){app.innerHTML=`<section class="hero"><div><div class="eyebrow">AI-native hiring, built for creative teams</div><h1>Find the creator behind the next big idea.</h1><p>Discover AI filmmakers, animators and generative designers through real work, verified workflows and tool-level skills.</p></div><button class="btn primary" onclick="brief()">+ Create AI Brief</button></section><div class="stats"><div class="stat"><b>1,248</b><span>AI creators indexed</span></div><div class="stat"><b>94%</b><span>profile verification coverage</span></div><div class="stat"><b>4.8/5</b><span>average creator rating</span></div><div class="stat"><b>10×</b><span>faster discovery</span></div></div><div class="layout"><aside class="panel filters"><h3>Discover creators</h3><form id="filterForm" oninput="load()"><div class="field"><label>Search</label><input name="search" placeholder="e.g. Midjourney, fashion"></div><div class="field"><label>Specialization</label><select name="specialization"><option value="">All specializations</option><option>AI Filmmaking</option><option>AI Animation</option><option>Generative Design</option><option>Product Ads</option></select></div><div class="field"><label>AI Tool / Model</label><select name="tool"><option value="">All tools</option><option>Runway Gen-3</option><option>Kling</option><option>Midjourney</option><option>ComfyUI</option><option>Stable Diffusion</option><option>FLUX</option><option>Adobe Firefly</option></select></div><div class="field"><label>Content format</label><select name="format"><option value="">All formats</option><option>Video</option><option>Image</option><option>3D / Animation</option></select></div><div class="field"><label>Sort</label><select name="sort"><option value="match">Best match</option><option value="rating">Top rated</option><option value="rate">Lowest rate</option></select></div></form><button class="btn secondary" style="width:100%" onclick="resetFilters()">Reset filters</button></aside><section><div style="margin-bottom:12px"><h2><span id="count">0</span> creators matched</h2></div><div id="grid" class="grid"></div></section></div>`;load()}
function shortlisted(){app.innerHTML='<h1>Shortlisted Creators</h1><p style="color:#697084">Creators you selected for your projects.</p><div id="grid" class="grid"></div>';fetch(API+'/creators').then(r=>r.json()).then(d=>{let x=d.filter(c=>shortlist.has(c.id));grid.innerHTML=x.length?x.map(card).join(''):'<div class="empty">No creators shortlisted yet. Go to Discover and select creators.</div>'})}
function showShortCount(){document.getElementById('shortCount').textContent=shortlist.size}showShortCount();discover();
</script></body></html>
