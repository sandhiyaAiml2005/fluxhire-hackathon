<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FLIXHIRE — AI Creator Marketplace</title>

<style>

:root{
--bg:#f7f8fc;
--surface:#ffffff;
--surface2:#f0f2f8;
--text:#121522;
--muted:#697084;
--line:#e3e6ee;
--accent:#6d4aff;
--accent2:#8b72ff;
--green:#18a86b;
--red:#e05252;
--shadow:0 14px 40px rgba(28,31,52,.08);
}

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:var(--bg);
color:var(--text);
}

button,
input,
select,
textarea{
font:inherit;
}

button{
cursor:pointer;
}

header{
height:72px;
background:rgba(255,255,255,.95);
border-bottom:1px solid var(--line);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 34px;
position:sticky;
top:0;
z-index:30;
backdrop-filter:blur(12px);
}

.logo{
display:flex;
gap:10px;
align-items:center;
font-weight:800;
font-size:19px;
}

.mark{
width:36px;
height:36px;
border-radius:11px;
background:linear-gradient(135deg,var(--accent),#b09cff);
display:grid;
place-items:center;
color:white;
font-weight:900;
}

.nav{
display:flex;
gap:7px;
}

.nav button{
border:0;
background:transparent;
padding:10px 14px;
border-radius:10px;
color:var(--muted);
}

.nav button:hover,
.nav button.active{
background:var(--surface2);
color:var(--text);
}

.avatar{
width:38px;
height:38px;
border-radius:50%;
background:#1c2030;
color:white;
display:grid;
place-items:center;
font-weight:700;
}

main{
max-width:1320px;
margin:auto;
padding:34px;
}

.hero{
display:flex;
justify-content:space-between;
align-items:flex-end;
gap:30px;
margin-bottom:28px;
}

.eyebrow{
font-size:12px;
text-transform:uppercase;
letter-spacing:.12em;
color:var(--accent);
font-weight:800;
}

.hero h1{
font-size:40px;
line-height:1.05;
margin:8px 0;
}

.hero p{
color:var(--muted);
max-width:680px;
margin:0;
line-height:1.6;
}

.primary{
border:0;
background:var(--accent);
color:white;
padding:12px 17px;
border-radius:11px;
font-weight:750;
box-shadow:0 8px 20px rgba(109,74,255,.22);
}

.primary:hover{
background:#5937ef;
}

.secondary{
border:1px solid var(--line);
background:white;
color:var(--text);
padding:11px 15px;
border-radius:11px;
font-weight:700;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px;
margin-bottom:22px;
}

.stat{
background:var(--surface);
border:1px solid var(--line);
border-radius:15px;
padding:17px;
}

.stat b{
font-size:24px;
}

.stat span{
display:block;
color:var(--muted);
font-size:12px;
margin-top:5px;
}

.layout{
display:grid;
grid-template-columns:255px 1fr;
gap:20px;
}

.panel{
background:var(--surface);
border:1px solid var(--line);
border-radius:16px;
box-shadow:var(--shadow);
}

.filters{
padding:18px;
height:max-content;
position:sticky;
top:90px;
}

.filters h3{
margin:0 0 16px;
}

.field{
margin:15px 0;
}

.field label{
display:block;
font-size:12px;
font-weight:750;
margin-bottom:7px;
}

.field input,
.field select,
.field textarea{
width:100%;
border:1px solid var(--line);
border-radius:9px;
padding:10px;
background:white;
outline:none;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
border-color:var(--accent);
}

.check{
display:flex;
gap:8px;
align-items:center;
font-size:13px;
color:var(--muted);
margin:8px 0;
}

.resultsHead{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:13px;
}

.resultsHead h2{
font-size:18px;
margin:0;
}

.creatorGrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.creator{
padding:16px;
transition:.2s;
cursor:pointer;
}

.creator:hover{
transform:translateY(-2px);
box-shadow:0 18px 42px rgba(28,31,52,.12);
}

.cover{
height:145px;
border-radius:12px;
background:linear-gradient(135deg,#171a2b,#6150c8);
position:relative;
overflow:hidden;
display:flex;
align-items:flex-end;
padding:13px;
color:white;
}

.cover:before,
.cover:after{
content:"";
position:absolute;
border-radius:50%;
filter:blur(1px);
}

.cover:before{
width:150px;
height:150px;
background:#ff75c3;
opacity:.45;
right:-25px;
top:-45px;
}

.cover:after{
width:120px;
height:120px;
background:#50e7ff;
opacity:.32;
left:-30px;
bottom:-50px;
}

.coverText{
position:relative;
z-index:1;
font-weight:800;
font-size:16px;
}

.creatorTop{
display:flex;
justify-content:space-between;
gap:12px;
margin-top:13px;
}

.person{
display:flex;
gap:10px;
align-items:center;
}

.mini{
width:40px;
height:40px;
border-radius:12px;
background:var(--surface2);
display:grid;
place-items:center;
font-weight:800;
}

.person b{
display:block;
}

.person small{
color:var(--muted);
}

.verified{
font-size:11px;
background:#e9f9f2;
color:#08764a;
padding:5px 8px;
border-radius:20px;
font-weight:750;
height:max-content;
}

.tags{
display:flex;
flex-wrap:wrap;
gap:6px;
margin:11px 0;
}

.tag{
font-size:11px;
background:var(--surface2);
padding:5px 7px;
border-radius:6px;
color:#555d70;
}

.meta{
display:flex;
justify-content:space-between;
color:var(--muted);
font-size:12px;
border-top:1px solid var(--line);
padding-top:11px;
}

.match{
color:var(--accent);
font-weight:800;
}

.empty{
text-align:center;
padding:50px;
color:var(--muted);
}

.modal{
position:fixed;
inset:0;
background:rgba(11,13,22,.55);
display:none;
align-items:center;
justify-content:center;
padding:20px;
z-index:100;
}

.modal.show{
display:flex;
}

.dialog{
background:white;
width:min(850px,100%);
max-height:92vh;
overflow:auto;
border-radius:20px;
padding:25px;
box-shadow:0 30px 80px rgba(0,0,0,.25);
}

.dialogHead{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:20px;
}

.close{
border:0;
background:var(--surface2);
border-radius:9px;
width:36px;
height:36px;
font-size:20px;
}

.detail{
display:grid;
grid-template-columns:1fr 1fr;
gap:22px;
margin-top:20px;
}

.portfolioBig{
height:250px;
border-radius:14px;
background:linear-gradient(135deg,#16192b,#8a6dff);
display:grid;
place-items:center;
color:white;
font-size:24px;
font-weight:850;
}

.signal{
display:flex;
gap:9px;
align-items:center;
margin:9px 0;
font-size:13px;
}

.dot{
width:8px;
height:8px;
border-radius:50%;
background:var(--green);
}

.reviewSection{
margin-top:28px;
border-top:1px solid var(--line);
padding-top:22px;
}

.review{
padding:15px;
border:1px solid var(--line);
border-radius:13px;
margin-top:10px;
background:#fafbfe;
}

.reviewTop{
display:flex;
justify-content:space-between;
gap:10px;
}

.reviewName{
font-weight:800;
}

.stars{
color:#f3a900;
letter-spacing:1px;
}

.review small{
color:var(--muted);
}

.review p{
margin-bottom:0;
color:#4e5669;
line-height:1.5;
}

.demoReview{
font-size:11px;
color:var(--accent);
background:#eeeaff;
padding:4px 7px;
border-radius:5px;
}

.rolePage{
min-height:calc(100vh - 72px);
display:flex;
align-items:center;
justify-content:center;
padding:50px 20px;
}

.roleBox{
max-width:900px;
width:100%;
text-align:center;
}

.roleBox h1{
font-size:42px;
margin:10px 0;
}

.roleBox>p{
color:var(--muted);
font-size:16px;
}

.roleCards{
display:grid;
grid-template-columns:1fr 1fr;
gap:22px;
margin-top:35px;
}

.roleCard{
background:white;
border:1px solid var(--line);
border-radius:20px;
padding:35px 25px;
box-shadow:var(--shadow);
transition:.2s;
cursor:pointer;
}

.roleCard:hover{
transform:translateY(-5px);
border-color:var(--accent);
}

.roleIcon{
font-size:50px;
}

.roleCard h2{
margin:15px 0 8px;
}

.roleCard p{
color:var(--muted);
line-height:1.5;
}

.portfolioPage{
max-width:1000px;
margin:auto;
}

.portfolioHeader{
margin-bottom:25px;
}

.portfolioHeader h1{
font-size:36px;
margin:8px 0;
}

.portfolioForm{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
}

.portfolioForm .full{
grid-column:1/-1;
}

.portfolioForm textarea{
min-height:120px;
resize:vertical;
}

.toolGrid{
display:flex;
flex-wrap:wrap;
gap:8px;
}

.toolOption{
border:1px solid var(--line);
padding:8px 12px;
border-radius:20px;
background:white;
cursor:pointer;
font-size:13px;
}

.toolOption.selected{
background:#eeeaff;
border-color:var(--accent);
color:var(--accent);
font-weight:700;
}

.successBox{
display:none;
background:#e9f9f2;
border:1px solid #bcead6;
color:#08764a;
padding:15px;
border-radius:12px;
margin-top:15px;
}

.briefGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}

.aiBox{
margin:16px 0;
padding:16px;
border-radius:12px;
background:#f2efff;
border:1px solid #ded6ff;
}

.toast{
position:fixed;
right:22px;
bottom:22px;
background:#171a2b;
color:white;
padding:13px 17px;
border-radius:11px;
display:none;
z-index:200;
box-shadow:var(--shadow);
}

@media(max-width:900px){

header{
padding:0 15px;
}

.nav{
display:none;
}

main{
padding:22px 15px;
}

.hero{
align-items:flex-start;
flex-direction:column;
}

.stats{
grid-template-columns:1fr 1fr;
}

.layout{
grid-template-columns:1fr;
}

.filters{
position:static;
}

.creatorGrid{
grid-template-columns:1fr;
}

.detail,
.roleCards,
.portfolioForm,
.briefGrid{
grid-template-columns:1fr;
}

.portfolioForm .full{
grid-column:auto;
}

.roleBox h1{
font-size:32px;
}

}

</style>
</head>
